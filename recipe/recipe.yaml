schema_version: 1

context:
  name: opentelemetry-instrumentation-haystack
  version: "0.62.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_haystack-${{ version }}.tar.gz
  sha256: 2c2c18db519380f5385cb31857ae5581d6703d185882d80e956e083a4aeefa6f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0

tests:
  - python:
      imports:
        - opentelemetry.instrumentation.haystack
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: OpenTelemetry Haystack instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
